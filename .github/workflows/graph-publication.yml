name: graph-publication
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/graphpublication/**'
      - 'journal/graph*.go'
      - 'reconcile/**'
      - 'retention/**'
      - 'worker/graph_journal*.go'
      - 'worker/graph_signal*.go'
      - 'worker/graph_terminal*.go'
      - 'worker/graph_child*.go'
      - 'worker/graph_parent*.go'
      - 'worker/graph_start*.go'
      - 'wf/graph_outcome.go'
      - 'wf/graph_child_retention*.go'
      - 'wf/context.go'
      - 'worker/worker.go'
      - 'worker/terminal_delivery.go'
      - 'worker/continuation.go'
      - 'client/graph_journal*.go'
      - 'client/graph_signal*.go'
      - 'client/graph_bind*.go'
      - 'client/graph_start*.go'
      - 'client/client.go'
      - 'client/signal_port.go'
      - 'internal/retainedgraph/**'
      - 'internal/retainedindex/**'
      - 'sim/graph_publication*'
      - 'sim/graph_checkpoint_compaction_test.go'
      - 'sim/graph_await_contention*'
      - 'client/graph_await_contention_test.go'
      - 'sim/testdata/regressions/graph-await-*'
      - 'sim/journal_transport_test.go'
      - 'sim/purge_transport.go'
      - 'sim/blob_sweep_transport.go'
      - 'sim/testdata/regressions/graph-publication-*'
      - 'sim/testdata/regressions/graph-readers-*'
      - 'sim/testdata/regressions/graph-compaction-*'
      - 'sim/testdata/regressions/graph-reader-resume-*'
      - 'sim/testdata/regressions/graph-catalog-*'
      - 'sim/testdata/regressions/graph-application-*'
      - 'sim/testdata/regressions/graph-streams-*'
      - 'sim/testdata/regressions/graph-start-*'
      - 'sim/testdata/regressions/graph-journal-*'
      - 'sim/testdata/regressions/graph-worker-*'
      - 'sim/testdata/regressions/graph-result-*'
      - 'sim/testdata/regressions/graph-child-*'
      - 'sim/testdata/regressions/graph-reconcile-*'
      - 'sim/testdata/regressions/graph-purge-*'
      - 'sim/testdata/regressions/graph-signal-client-*'
      - 'sim/testdata/regressions/graph-signal-runtime-*'
      - 'sim/testdata/regressions/graph-parent-worker-*'
      - 'internal/blobpublication/**'
      - 'internal/natsstream/**'
      - 'testcluster/cluster.go'
      - 'testcluster/process_cluster.go'
      - '.github/workflows/graph-publication.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/graphpublication/**'
      - 'journal/graph*.go'
      - 'reconcile/**'
      - 'retention/**'
      - 'worker/graph_journal*.go'
      - 'worker/graph_signal*.go'
      - 'worker/graph_terminal*.go'
      - 'worker/graph_child*.go'
      - 'worker/graph_parent*.go'
      - 'worker/graph_start*.go'
      - 'wf/graph_outcome.go'
      - 'wf/graph_child_retention*.go'
      - 'wf/context.go'
      - 'worker/worker.go'
      - 'worker/terminal_delivery.go'
      - 'worker/continuation.go'
      - 'client/graph_journal*.go'
      - 'client/graph_signal*.go'
      - 'client/graph_bind*.go'
      - 'client/graph_start*.go'
      - 'client/client.go'
      - 'client/signal_port.go'
      - 'internal/retainedgraph/**'
      - 'internal/retainedindex/**'
      - 'sim/graph_publication*'
      - 'sim/graph_checkpoint_compaction_test.go'
      - 'sim/graph_await_contention*'
      - 'client/graph_await_contention_test.go'
      - 'sim/testdata/regressions/graph-await-*'
      - 'sim/journal_transport_test.go'
      - 'sim/purge_transport.go'
      - 'sim/blob_sweep_transport.go'
      - 'sim/testdata/regressions/graph-publication-*'
      - 'sim/testdata/regressions/graph-readers-*'
      - 'sim/testdata/regressions/graph-compaction-*'
      - 'sim/testdata/regressions/graph-reader-resume-*'
      - 'sim/testdata/regressions/graph-catalog-*'
      - 'sim/testdata/regressions/graph-application-*'
      - 'sim/testdata/regressions/graph-streams-*'
      - 'sim/testdata/regressions/graph-start-*'
      - 'sim/testdata/regressions/graph-journal-*'
      - 'sim/testdata/regressions/graph-worker-*'
      - 'sim/testdata/regressions/graph-result-*'
      - 'sim/testdata/regressions/graph-child-*'
      - 'sim/testdata/regressions/graph-reconcile-*'
      - 'sim/testdata/regressions/graph-purge-*'
      - 'sim/testdata/regressions/graph-signal-client-*'
      - 'sim/testdata/regressions/graph-signal-runtime-*'
      - 'sim/testdata/regressions/graph-parent-worker-*'
      - 'internal/blobpublication/**'
      - 'internal/natsstream/**'
      - 'testcluster/cluster.go'
      - 'testcluster/process_cluster.go'
      - '.github/workflows/graph-publication.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seeded graph ownership and collection controls
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./internal/natsstream ./internal/graphpublication ./internal/retainedindex -count=1 -timeout=5m -json > graph-publication-events.jsonl
      - name: Generation-aware graph journal and native payload retention
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./journal -run '^(TestGraphJournal|TestNativeGraphJournal|TestGraphCanonicalStart|TestGraphCanonicalSignalInputs|TestNativeGraphCanonicalSignalInputs|TestGraphCanonicalSignalQueue|TestGraphCanonicalSignalConsumption)' -count=1 -timeout=5m -json > graph-journal-events.jsonl
      - name: Native graph worker input signal result replay and drain
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./worker -run '^(TestNativeGraphWorkerReplayInputsSignalsAndResults|TestNativeGraphChildResultTransferAndReplay|TestGraphChildReplayRejectsForgedProvenance|TestGraphSelectedChildRequiresExactRecordedSignal|TestNativeGraphWorkerParentNotifications|TestNativeCanonicalStartRecoveryWorkerReplayAndPurge)$' -count=1 -timeout=5m -json > graph-worker-events.jsonl
      - name: Canonical Signal queue consumption replay and child transfer
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./worker -run '^(TestNativeCanonicalSignalQueue|TestGraphCanonicalSignalReplayReadsJournalOwnedBodyOnce)' -count=1 -timeout=5m -json > graph-signal-worker-events.jsonl
      - name: Canonical graph repair decisions and native wakeup recovery
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./reconcile -run '^(TestGraphReconcile|TestNativeGraphReconcile|TestGraphCanonicalStart|TestGraphCanonicalSignal|TestGraphCanonicalTerminalScan|TestGraphCanonicalCatalogCycles)' -count=1 -timeout=5m -json > graph-reconcile-events.jsonl
      - name: Canonical graph client terminal reads
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./client -count=1 -timeout=5m -json > graph-client-events.jsonl
      - name: Canonical graph purge and durable retention workflow
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./retention -count=1 -timeout=5m -json > graph-retention-events.jsonl
      - name: Workflow child ownership authorization
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./wf -count=1 -timeout=5m -json > graph-workflow-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-publication-${{ matrix.mode }}
          path: |
            graph-publication-events.jsonl
            graph-journal-events.jsonl
            graph-worker-events.jsonl
            graph-signal-worker-events.jsonl
            graph-client-events.jsonl
            graph-reconcile-events.jsonl
            graph-retention-events.jsonl
            graph-workflow-events.jsonl
  checkpoint-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Checkpoint metadata ownership and malformed authority
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./journal -run '^(TestGraphCheckpoint|TestGraphArchiveDescriptor)' -count=1 -timeout=5m -json > graph-checkpoint-metadata-events.jsonl
      - name: Native archive lifecycle and observed process kills
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
          ARCHIVE_PROCESS_EVIDENCE: ${{ github.workspace }}/archive-process-evidence
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./journal -run '^(TestNativeGraphCheckpointArchive|TestProcessGraphCheckpointArchive)' -count=1 -timeout=5m -json > graph-checkpoint-archive-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-checkpoint-archive-${{ matrix.mode }}
          path: |
            graph-checkpoint-metadata-events.jsonl
            graph-checkpoint-archive-events.jsonl
            archive-process-evidence
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.family == 'SignalExpiryActors' && 305 || matrix.family == 'SignalExpiryCartesian' && 15 || matrix.family == 'SignalOperationActors' && 95 || matrix.family == 'SignalRuntimeCombined' && 65 || matrix.family == 'SignalRuntimeCartesian' && 35 || matrix.family == 'CheckpointCompaction' && 35 || matrix.family == 'SignalRuntime' && 45 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
        family: [NativeAuthority, Publication, Readers, ReaderResume, ReaderMaintenance, Catalog, Application, Streams, Journal, Worker, Result, TerminalWorker, TerminalProjection, TerminalCatalog, TerminalAudit, Child, ChildSignal, Reconcile, Purge, SignalClient, ParentWorker, Start, StartRepair, SignalRuntime, SignalRuntimeCombined, SignalRuntimeCartesian, SignalOperationActors, SignalExpiryActors, SignalExpiryCartesian, CheckpointCompaction, AwaitContention, Corpus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seeded family or complete pinned corpus
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
          GRAPH_FAMILY: ${{ matrix.family }}
          SIM_SEEDS: '1000'
          SIM_COVERAGE_SUMMARY: '1'
          SIM_PROGRESS: '1'
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          graph_pattern="^TestSeededGraph${GRAPH_FAMILY}Replay$"
          if [ "$GRAPH_FAMILY" = Corpus ]; then
            graph_pattern='^(TestPinnedRegressionCorpus|TestGraphPublicationTransportCopiesFaultsAndIndependentCensus|TestGraphChildSeedPipelineOrdersAndJoins|TestGraphWorkerCompletionAppendReaderInterleaving)$'
          fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCartesian ]; then
            graph_pattern='^TestGraphSignalRuntimeCartesianReplay$'
          fi
          if [ "$GRAPH_FAMILY" = SignalExpiryCartesian ]; then graph_pattern="^TestGraphSignalExpiryCartesianReplay$"; fi
          graph_timeout=5m
          if [ "$GRAPH_FAMILY" = CheckpointCompaction ]; then graph_timeout=30m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntime ]; then graph_timeout=40m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCombined ]; then graph_timeout=60m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCartesian ]; then graph_timeout=30m; fi
          if [ "$GRAPH_FAMILY" = SignalOperationActors ]; then graph_timeout=90m; fi
          if [ "$GRAPH_FAMILY" = SignalExpiryActors ]; then graph_timeout=300m; fi
          if [ "$GRAPH_FAMILY" = SignalExpiryCartesian ]; then graph_timeout=10m; fi
          go test -p=1 "${graph_flags[@]}" ./sim -run "$graph_pattern" -count=1 -timeout="$graph_timeout" -json > graph-transport-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-transport-${{ matrix.family }}-${{ matrix.mode }}
          path: graph-transport-events.jsonl
