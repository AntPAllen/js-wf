name: graph-publication
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/graphpublication/**'
      - 'journal/graph*.go'
      - 'worker/graph_journal*.go'
      - 'worker/graph_terminal*.go'
      - 'worker/graph_child*.go'
      - 'wf/graph_outcome.go'
      - 'wf/context.go'
      - 'worker/worker.go'
      - 'worker/terminal_delivery.go'
      - 'worker/continuation.go'
      - 'client/graph_journal*.go'
      - 'client/client.go'
      - 'internal/retainedgraph/**'
      - 'sim/graph_publication*'
      - 'sim/journal_transport_test.go'
      - 'sim/testdata/regressions/graph-publication-*'
      - 'sim/testdata/regressions/graph-readers-*'
      - 'sim/testdata/regressions/graph-reader-resume-*'
      - 'sim/testdata/regressions/graph-catalog-*'
      - 'sim/testdata/regressions/graph-application-*'
      - 'sim/testdata/regressions/graph-journal-*'
      - 'sim/testdata/regressions/graph-worker-*'
      - 'sim/testdata/regressions/graph-result-*'
      - 'sim/testdata/regressions/graph-child-*'
      - 'internal/blobpublication/**'
      - 'internal/natsstream/**'
      - 'testcluster/cluster.go'
      - '.github/workflows/graph-publication.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/graphpublication/**'
      - 'journal/graph*.go'
      - 'worker/graph_journal*.go'
      - 'worker/graph_terminal*.go'
      - 'worker/graph_child*.go'
      - 'wf/graph_outcome.go'
      - 'wf/context.go'
      - 'worker/worker.go'
      - 'worker/terminal_delivery.go'
      - 'worker/continuation.go'
      - 'client/graph_journal*.go'
      - 'client/client.go'
      - 'internal/retainedgraph/**'
      - 'sim/graph_publication*'
      - 'sim/journal_transport_test.go'
      - 'sim/testdata/regressions/graph-publication-*'
      - 'sim/testdata/regressions/graph-readers-*'
      - 'sim/testdata/regressions/graph-reader-resume-*'
      - 'sim/testdata/regressions/graph-catalog-*'
      - 'sim/testdata/regressions/graph-application-*'
      - 'sim/testdata/regressions/graph-journal-*'
      - 'sim/testdata/regressions/graph-worker-*'
      - 'sim/testdata/regressions/graph-result-*'
      - 'sim/testdata/regressions/graph-child-*'
      - 'internal/blobpublication/**'
      - 'internal/natsstream/**'
      - 'testcluster/cluster.go'
      - '.github/workflows/graph-publication.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seeded graph ownership and collection controls
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./internal/natsstream ./internal/graphpublication -count=1 -timeout=5m -json > graph-publication-events.jsonl
      - name: Generation-aware graph journal and native payload retention
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./journal -run '^(TestGraphJournal|TestNativeGraphJournal)' -count=1 -timeout=5m -json > graph-journal-events.jsonl
      - name: Native graph worker input signal result replay and drain
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./worker -run '^(TestNativeGraphWorkerReplayInputsSignalsAndResults|TestNativeGraphChildResultTransferAndReplay|TestGraphChildReplayRejectsForgedProvenance|TestGraphSelectedChildRequiresExactRecordedSignal)$' -count=1 -timeout=5m -json > graph-worker-events.jsonl
      - name: Canonical graph client terminal reads
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./client -count=1 -timeout=5m -json > graph-client-events.jsonl
      - name: Common seeded transport and pinned trace dispatch
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
          SIM_COVERAGE_SUMMARY: '1'
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          go test -p=1 "${graph_flags[@]}" ./sim -run '^(TestSeededGraphPublicationReplay|TestSeededGraphReadersReplay|TestSeededGraphReaderResumeReplay|TestSeededGraphCatalogReplay|TestSeededGraphApplicationReplay|TestSeededGraphJournalReplay|TestSeededGraphWorkerReplay|TestSeededGraphResultReplay|TestSeededGraphTerminalWorkerReplay|TestSeededGraphChildReplay|TestSeededGraphChildSignalReplay|TestGraphChildSeedPipelineOrdersAndJoins|TestGraphPublicationTransportCopiesFaultsAndIndependentCensus|TestPinnedRegressionCorpus)$/^(graph-publication-|graph-readers-|graph-reader-resume-|graph-catalog-|graph-application-|graph-journal-|graph-worker-|graph-result-|graph-child-)' -count=1 -timeout=5m -json > graph-transport-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-publication-${{ matrix.mode }}
          path: |
            graph-publication-events.jsonl
            graph-transport-events.jsonl
            graph-journal-events.jsonl
            graph-worker-events.jsonl
            graph-client-events.jsonl
