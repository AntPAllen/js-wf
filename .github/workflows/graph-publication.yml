permissions:
  contents: read
jobs:
  graph-limit-error-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: 4
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reject unclassified and uncertain profile gates
        run: python3 scripts/test_graph_limit_profile.py -v
      - name: Classify native CAS and preserve concurrent profile snapshots
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./worker -run '^(TestGraphLimitProfileErrorClassificationAndSnapshots|TestGraphLimitProfileNativeCASClassification)$' -count=1 -v -timeout=5m 2>&1 | tee graph-limit-error-classification.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('graph-limit-error-classification.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for test in ('TestGraphLimitProfileErrorClassificationAndSnapshots', 'TestGraphLimitProfileNativeCASClassification'):
              assert f'--- PASS: {test} ' in log
          assert 'NATIVE_PROFILE_CLASSIFICATION calls=2 errors=1 conflict=1 wrapped_conflict=0' in log
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-limit-error-classification
          path: graph-limit-error-classification.log
          if-no-files-found: error
  raw-sdk-checkpoint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: 4
      GOMEMLIMIT: 2GiB
      WF_GRAPH_SDK_RAW_AUDIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Audit production SDK checkpoint and child provenance
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./worker -run '^(TestNativeGraphContinuationSDKFlow|TestNativeGraphContinuationChildPromise|TestNativeGraphContinuationBufferedChildPromise|TestNativeGraphContinuationBufferedSignals)$' -count=1 -v -timeout=8m 2>&1 | tee raw-sdk-checkpoint-audit.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('raw-sdk-checkpoint-audit.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for test in ('TestNativeGraphContinuationSDKFlow', 'TestNativeGraphContinuationChildPromise', 'TestNativeGraphContinuationBufferedChildPromise', 'TestNativeGraphContinuationBufferedSignals'):
              for layout in ('R1', 'R3Domain'):
                  assert f'--- PASS: {test}/{layout} ' in log
          assert len(re.findall(r'RAW_SDK_CHECKPOINT_AUDIT journals=\d+ entries=\d+ terminals=[1-9]\d* pending=0', log)) == 8
          retired = re.findall(r'RAW_SDK_CHECKPOINT_AUDIT journals=\d+ entries=\d+ terminals=[1-9]\d* pending=0 retired_projection_only=([01])', log)
          assert len(retired) == 8 and retired.count('1') == 4 and retired.count('0') == 4
          assert log.count('RAW_SDK_CHECKPOINT_HISTORY checkpoints=2') == 8
          PY
      - name: Preserve successor on lease initialization conflict
        shell: bash
        run: |
          set -o pipefail
          go test -race ./lease -run '^TestInitializationConflictPreservesSuccessor$' -count=1 -v -timeout=1m 2>&1 | tee lease-initialization-conflict.log
          python3 - <<'PY'
          import pathlib
          assert '--- PASS: TestInitializationConflictPreservesSuccessor ' in pathlib.Path('lease-initialization-conflict.log').read_text()
          PY
      - name: Audit positive timer scheduled delivery and continuations
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./worker -run '^TestNativeGraphContinuationScheduledTimerFlow$' -count=1 -v -timeout=4m 2>&1 | tee raw-sdk-positive-timer.log
          python3 - <<'PYGUARD'
          import pathlib, re
          log = pathlib.Path('raw-sdk-positive-timer.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for layout in ('R1', 'R3Domain'):
              assert f'--- PASS: TestNativeGraphContinuationScheduledTimerFlow/{layout} ' in log
          assert log.count('SDK_POSITIVE_TIMER suspended=1 handoffs=2 start=1 schedules=3 initial=2 next=1 finish=1 effects=2') == 2
          assert len(re.findall(r'RAW_SDK_CHECKPOINT_AUDIT journals=1 entries=\d+ terminals=1 pending=0 retired_projection_only=0', log)) == 2
          PYGUARD
      - name: Reject cancelled timer wakeups after archived checkpoints
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./worker -run '^TestNativeGraphContinuationCancelledTimerWakeup$' -count=1 -v -timeout=4m 2>&1 | tee raw-sdk-cancelled-timer-wakeup.log
          python3 - <<'PYGUARD'
          import pathlib, re
          log = pathlib.Path('raw-sdk-cancelled-timer-wakeup.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for layout in ('R1', 'R3Domain'):
              assert f'--- PASS: TestNativeGraphContinuationCancelledTimerWakeup/{layout} ' in log
          for stage, step in (('next', 4), ('finish', 4), ('finish', 14)):
              assert log.count(f'SDK_CANCELLED_TIMER_WAKEUP stage={stage} step={step} no_op=true immutable_history=true unchanged_effects=true archive=true') == 2
          assert len(re.findall(r'RAW_SDK_CHECKPOINT_AUDIT journals=1 entries=\d+ terminals=1 pending=0 retired_projection_only=0', log)) == 2
          PYGUARD
      - name: Audit native timer handle history through archived checkpoints
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./worker -run '^TestNativeGraphContinuationTimerHistory$' -count=1 -v -timeout=8m 2>&1 | tee raw-sdk-timer-history.log
          python3 - <<'PYGUARD'
          import pathlib, re
          log = pathlib.Path('raw-sdk-timer-history.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for layout in ('R1', 'R3Domain'):
              for archive in ('false', 'true'):
                  assert f'--- PASS: TestNativeGraphContinuationTimerHistory/{layout}/archive={archive} ' in log
          assert len(re.findall(r'SDK_TIMER_HISTORY stage=next cancelled=\[4\] archive=(?:true|false)', log)) == 4
          assert len(re.findall(r'SDK_TIMER_HISTORY stage=finish cancelled=\[4,14\] archive=(?:true|false)', log)) == 4
          assert len(re.findall(r'RAW_SDK_CHECKPOINT_AUDIT journals=1 entries=\d+ terminals=1 pending=0 retired_projection_only=0', log)) == 4
          PYGUARD
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-sdk-checkpoint-audit
          path: |
            raw-sdk-checkpoint-audit.log
            raw-sdk-timer-history.log
            raw-sdk-positive-timer.log
            raw-sdk-cancelled-timer-wakeup.log
            lease-initialization-conflict.log
          if-no-files-found: error
  raw-graph-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Audit raw graph roots, grants and physical objects
        shell: bash
        run: |
          set -o pipefail
          go test -race -p=1 ./integrity -run '^(TestRawGraphReferencesAndIndependentCorruptionControls|TestNativeRawGraphReferenceAuditQuiescentReaders|TestRawGraphJournalGenerationsOutcomesAndArchive|TestRawGraphCheckpointPointerAndFrameBindings|TestNativeRawGraphCheckpointAudit|TestRawGraphCheckpointMaterializedState|TestRawGraphCheckpointPromiseOwnership|TestRawGraphCheckpointMetadataBindings|TestRawGraphRetiredSourceProjectionScope|TestRawGraphSignalReservationAndBinding|TestRawGraphSignalIndexIndependentPrefixes|TestRawGraphSignalIndexProductionPackets|TestRawGraphCheckpointSDKStateHistory|TestRawGraphCheckpointPromiseHistory|TestRawGraphCheckpointSDKSignalHistory|TestRawGraphCheckpointSDKTimerHistory|TestRawGraphEveryCheckpointHistory|TestRawGraphSDKStepEnvelope|TestRawGraphCanonicalEnvelope|TestRawGraphTerminalEnvelope|TestRawGraphRejectedLimitBoundary|TestRawGraphRejectedLimitPrefix|TestRawGraphRejectedLimitContinuation)$' -count=1 -v -timeout=5m 2>&1 | tee raw-graph-audit.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('raw-graph-audit.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for replicas in (1, 3):
              for indexed in ('false', 'true'):
                  assert f'--- PASS: TestNativeRawGraphReferenceAuditQuiescentReaders/R{replicas}/indexed{indexed} ' in log
          assert '--- PASS: TestRawGraphReferencesAndIndependentCorruptionControls ' in log
          assert '--- PASS: TestRawGraphJournalGenerationsOutcomesAndArchive ' in log
          assert '--- PASS: TestRawGraphCheckpointPointerAndFrameBindings ' in log
          assert '--- PASS: TestRawGraphCheckpointMaterializedState ' in log
          assert '--- PASS: TestRawGraphCheckpointPromiseOwnership ' in log
          assert '--- PASS: TestRawGraphCheckpointMetadataBindings ' in log
          assert '--- PASS: TestRawGraphCheckpointSDKStateHistory ' in log
          assert '--- PASS: TestRawGraphCheckpointPromiseHistory ' in log
          assert '--- PASS: TestRawGraphRejectedLimitBoundary ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('request', 'attempt', 'signal', 'suspension', 'overlap', 'completed', 'both', 'request-null', 'request-empty', 'request-unknown', 'request-duplicate', 'entry-kind', 'entry-null', 'attempt-gap', 'attempt-empty-error', 'attempt-alias', 'attempt-duplicate', 'signal-zero', 'signal-name', 'signal-alias', 'suspension-unresolved', 'suspension-empty', 'suspension-unknown', 'wrong-error'):
                  assert f'--- PASS: TestRawGraphRejectedLimitBoundary/{encoding}/{mode} ' in log
          assert '--- PASS: TestRawGraphRejectedLimitPrefix ' in log
          for mode in ('attempt-next', 'attempt-reuse', 'attempt-skip', 'signal-next', 'signal-reuse', 'signal-backwards'):
              assert f'--- PASS: TestRawGraphRejectedLimitPrefix/{mode} ' in log
          assert '--- PASS: TestRawGraphRejectedLimitContinuation ' in log
          for mode in ('checkpoint', 'wrong-stage', 'not-checkpoint', 'failed-frame'):
              assert f'--- PASS: TestRawGraphRejectedLimitContinuation/{mode} ' in log
          assert '--- PASS: TestRawGraphTerminalEnvelope ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('ordinary', 'opaque-result', 'failed', 'limit-request', 'limit-entry', 'unknown', 'alias', 'duplicate-invocation', 'escaped-duplicate', 'duplicate-result', 'duplicate-error', 'duplicate-limit-request', 'duplicate-limit-entry', 'limit-entry-unknown', 'limit-entry-alias', 'limit-entry-duplicate'):
                  assert f'--- PASS: TestRawGraphTerminalEnvelope/{encoding}/{mode} ' in log
          assert '--- PASS: TestRawGraphCanonicalEnvelope ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('outer-valid', 'outer-whitespace', 'outer-unknown', 'outer-alias', 'outer-duplicate', 'outer-escaped-duplicate', 'outer-generation', 'outer-sequence', 'outer-hash'):
                  assert f'--- PASS: TestRawGraphCanonicalEnvelope/{encoding}/{mode} ' in log
          assert '--- PASS: TestRawGraphSDKStepEnvelope ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('ordinary', 'opaque-field-names', 'opaque-duplicates', 'opaque-null', 'request-null', 'request-array', 'request-unknown', 'request-alias', 'request-duplicate', 'request-escaped-duplicate', 'request-time-type', 'request-step-negative', 'case-unknown', 'case-alias', 'case-duplicate', 'case-shape', 'completion-null', 'completion-array', 'completion-unknown', 'completion-alias', 'completion-duplicate', 'completion-sequence-negative', 'completion-case-fraction', 'completion-cancel-type', 'metadata-ref-null', 'metadata-ref-object', 'metadata-hash-null', 'metadata-hash-number'):
                  assert f'--- PASS: TestRawGraphSDKStepEnvelope/{encoding}/{mode} ' in log
          assert '--- PASS: TestRawGraphEveryCheckpointHistory ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('historical-valid', 'historical-state', 'historical-anchor', 'historical-locals', 'historical-cursor', 'historical-timer', 'historical-metadata'):
                  assert f'--- PASS: TestRawGraphEveryCheckpointHistory/{encoding}/{mode} ' in log
          assert '--- PASS: TestRawGraphCheckpointSDKTimerHistory ' in log
          for mode in ('absolute-position-and-deadline', 'cancel', 'await', 'timer-select', 'many-select', 'signal-then-cancel', 'carried-cancel', 'empty', 'missing-creation', 'wrong-name', 'wrong-deadline', 'wrong-domain', 'unconfirmed-cancel', 'cancel-after-fire', 'await-after-cancel', 'duplicate-cancel', 'live-checkpoint', 'omitted-cancel', 'fabricated-cancel', 'duplicate-cancel-id', 'bad-select-index', 'unselected-dead-timer'):
              assert f'--- PASS: TestRawGraphCheckpointSDKTimerHistory/{mode} ' in log
          assert '--- PASS: TestRawGraphCheckpointSDKSignalHistory ' in log
          for mode in ('signal', 'call', 'timer_signal_select', 'select_many', 'timer-branch', 'many-timer-branch', 'cached-promise', 'different-name-order', 'cursor-advanced', 'cursor-regressed', 'consumed-omitted', 'consumed-fabricated', 'consumed-duplicate', 'pending-omitted', 'pending-extra', 'pending-used', 'pending-name', 'pending-inline-bytes', 'pending-owned-bytes', 'pending-duplicate', 'pending-not-arrived', 'selection-missing', 'selection-name', 'selection-reused', 'selection-skips-oldest', 'timer-branch-invalid', 'timer-with-signal', 'case-index-missing', 'case-index-invalid', 'case-kind-invalid', 'many-timer-with-signal'):
              assert f'--- PASS: TestRawGraphCheckpointSDKSignalHistory/{mode} ' in log
          for mode in ('signal-inline', 'signal-external', 'explicit-inline', 'explicit-external', 'ambiguous-cache-omitted', 'cached-select-reuse', 'compacted-outcome', 'multiple-ambiguous-candidates', 'multiple-ambiguous-later', 'outcome-changed', 'name-changed', 'no-selection', 'child-declaration', 'child-generation', 'source-unowned', 'source-wrong-bytes', 'source-missing', 'external-unowned', 'explicit-cache-omitted', 'case-index-missing', 'cached-without-history', 'explicit-cache-reconsumed', 'arrival-missing'):
              assert f'--- PASS: TestRawGraphCheckpointPromiseHistory/{mode} ' in log
          for encoding in ('json', 'protobuf-v1'):
              for mode in ('history-valid', 'history-external-valid', 'history-read-absent-valid', 'history-write-error-valid', 'history-null-valid'):
                  assert f'--- PASS: TestRawGraphCheckpointSDKStateHistory/{encoding}/{mode} ' in log
          for mode in ('history-frame-value', 'history-frame-missing', 'history-frame-extra', 'history-write-hash', 'history-write-missing', 'history-write-error', 'history-read-fabricated', 'history-result-null', 'history-result-unknown', 'history-external-unowned', 'history-external-wrong'):
              assert f'--- PASS: TestRawGraphCheckpointSDKStateHistory/{mode} ' in log
          assert '--- PASS: TestRawGraphRetiredSourceProjectionScope ' in log
          assert '--- PASS: TestRawGraphSignalReservationAndBinding ' in log
          assert '--- PASS: TestRawGraphSignalIndexProductionPackets ' in log
          assert '--- PASS: TestRawGraphSignalIndexProductionPackets/maximum-depth ' in log
          for control in ('valid', 'magic', 'header-reserved', 'truncated', 'count', 'leaf-key', 'leaf-value', 'leaf-child', 'bit-overflow', 'node-reserved', 'left-reserved', 'right-reserved', 'branch-value', 'branch-prefix', 'branch-bit-order', 'future-record', 'same-record-forward', 'old-slot-missing', 'wrong-side', 'lost-prefix', 'lost-one-old-key', 'unreachable-node', 'canceled'):
              assert f'--- PASS: TestRawGraphSignalIndexIndependentPrefixes/{control} ' in log
          for control in ('index-magic', 'index-key', 'index-value', 'queue-index-key'):
              assert f'--- PASS: TestRawGraphSignalReservationAndBinding/{control} ' in log
          for encoding in ('json', 'protobuf-v1'):
              assert f'--- PASS: TestRawGraphSignalReservationAndBinding/{encoding} ' in log
              assert f'--- PASS: TestRawGraphSignalReservationAndBinding/{encoding}/consumed-valid ' in log
          for control in ('generation', 'reservation-index', 'name', 'key', 'size', 'body', 'token', 'binding-input', 'binding-index', 'source-zero', 'source-frontier', 'consumption-census', 'missing-body', 'consumed-index', 'consumed-token', 'consumed-name', 'consumed-sequence', 'consumed-ref', 'consumed-hash', 'consumed-no-marker', 'consumed-unowned'):
              assert f'--- PASS: TestRawGraphSignalReservationAndBinding/{control} ' in log
          for control in ('valid', 'purging-source', 'source-generation', 'projection-missing', 'projection-generation', 'projection-kind', 'nonterminal', 'live-forest'):
              assert f'--- PASS: TestRawGraphRetiredSourceProjectionScope/{control} ' in log
          for encoding in ('json', 'protobuf-v1'):
              assert f'--- PASS: TestRawGraphCheckpointMetadataBindings/{encoding}/valid ' in log
          for control in ('metadata-generation', 'metadata-anchor', 'metadata-frame', 'metadata-version', 'metadata-child', 'metadata-signal-prefix', 'metadata-buffered-child', 'metadata-half-pointer', 'metadata-wrong-edge', 'metadata-unowned'):
              assert f'--- PASS: TestRawGraphCheckpointMetadataBindings/{control} ' in log
          for encoding in ('json', 'protobuf-v1'):
              assert f'--- PASS: TestRawGraphCheckpointPromiseOwnership/{encoding}/valid ' in log
          for control in ('promise-owned-missing', 'promise-owned-wrong', 'promise-owned-conflict'):
              assert f'--- PASS: TestRawGraphCheckpointPromiseOwnership/{control} ' in log
          for encoding in ('json', 'protobuf-v1'):
              assert f'--- PASS: TestRawGraphCheckpointMaterializedState/{encoding}/valid ' in log
          for control in ('state-name', 'promise-name', 'promise-nonobject', 'promise-unknown-field', 'promise-hash-no-ref', 'promise-ref-bad-hash', 'promise-inline-and-ref', 'consumed-zero', 'consumed-duplicate', 'consumed-unsorted', 'pending-zero', 'pending-beyond-cursor', 'pending-consumed', 'pending-name', 'pending-duplicate', 'timer-odd', 'timer-beyond-position', 'timer-duplicate', 'panic-prefix-mismatch'):
              assert f'--- PASS: TestRawGraphCheckpointMaterializedState/{control} ' in log
          for control in ('pointer-generation', 'pointer-sequence', 'pointer-request', 'pointer-position', 'pointer-object', 'completion-result', 'request-kind', 'frame-unowned', 'frame-generation', 'frame-anchor', 'frame-stage', 'frame-position', 'frame-version', 'frame-locals'):
              assert f'--- PASS: TestRawGraphCheckpointPointerAndFrameBindings/{control} ' in log
          for replicas in (1, 3):
              for indexed in ('false', 'true'):
                  assert f'--- PASS: TestNativeRawGraphCheckpointAudit/R{replicas}/indexed{indexed} ' in log
                  for stage in ('unpublished', 'published', 'archived', 'terminal'):
                      entries, terminals = (5, 1) if stage == 'terminal' else (4, 0)
                      assert f'RAW_CHECKPOINT_AUDIT stage={stage} entries={entries} terminals={terminals} R{replicas} indexed={indexed}' in log
          for encoding in ('json', 'protobuf-v1'):
              for archived in ('false', 'true'):
