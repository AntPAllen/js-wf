  transport:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.family == 'SignalExpiryActors' && 305 || matrix.family == 'SignalExpiryCartesian' && 15 || matrix.family == 'SignalOperationActors' && 95 || matrix.family == 'SignalRuntimeCombined' && 65 || matrix.family == 'SignalRuntimeCartesian' && 35 || matrix.family == 'CheckpointCompaction' && 35 || matrix.family == 'SignalRuntime' && 45 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
        family: [NativeAuthority, Publication, Readers, ReaderResume, ReaderMaintenance, Catalog, Application, Streams, Journal, Worker, Result, TerminalWorker, TerminalProjection, TerminalCatalog, TerminalAudit, Child, ChildSignal, Reconcile, Purge, SignalClient, ParentWorker, Start, StartRepair, SignalRuntime, SignalRuntimeCombined, SignalRuntimeCartesian, SignalOperationActors, SignalExpiryActors, SignalExpiryCartesian, CheckpointCompaction, AwaitContention, Corpus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seeded family or complete pinned corpus
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          GRAPH_MODE: ${{ matrix.mode }}
          GRAPH_FAMILY: ${{ matrix.family }}
          SIM_SEEDS: '1000'
          SIM_COVERAGE_SUMMARY: '1'
          SIM_PROGRESS: '1'
        run: |
          graph_flags=()
          if [ "$GRAPH_MODE" = race ]; then graph_flags=(-race); fi
          graph_pattern="^TestSeededGraph${GRAPH_FAMILY}Replay$"
          if [ "$GRAPH_FAMILY" = Corpus ]; then
            graph_pattern='^(TestPinnedRegressionCorpus|TestGraphPublicationTransportCopiesFaultsAndIndependentCensus|TestGraphChildSeedPipelineOrdersAndJoins|TestGraphWorkerCompletionAppendReaderInterleaving)$'
          fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCartesian ]; then
            graph_pattern='^TestGraphSignalRuntimeCartesianReplay$'
          fi
          if [ "$GRAPH_FAMILY" = SignalExpiryCartesian ]; then graph_pattern="^TestGraphSignalExpiryCartesianReplay$"; fi
          graph_timeout=5m
          if [ "$GRAPH_FAMILY" = CheckpointCompaction ]; then graph_timeout=30m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntime ]; then graph_timeout=40m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCombined ]; then graph_timeout=60m; fi
          if [ "$GRAPH_FAMILY" = SignalRuntimeCartesian ]; then graph_timeout=30m; fi
          if [ "$GRAPH_FAMILY" = SignalOperationActors ]; then graph_timeout=90m; fi
          if [ "$GRAPH_FAMILY" = SignalExpiryActors ]; then graph_timeout=300m; fi
          if [ "$GRAPH_FAMILY" = SignalExpiryCartesian ]; then graph_timeout=10m; fi
          go test -p=1 "${graph_flags[@]}" ./sim -run "$graph_pattern" -count=1 -timeout="$graph_timeout" -json > graph-transport-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-transport-${{ matrix.family }}-${{ matrix.mode }}
          path: graph-transport-events.jsonl
