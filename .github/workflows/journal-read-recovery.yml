name: journal-read-recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/journal-read-recovery.yml'
      - 'journal/**'
      - 'internal/handlecache/**'
      - 'integration/journal_serial_response_test.go'
      - 'testcluster/client_proxy.go'
      - 'go.mod'
      - 'go.sum'
jobs:
  held-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
      SIM_SEEDS: '1000'
      SIM_COVERAGE_SUMMARY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Recover held metadata, serial, snapshot and consumer replies
        run: |
          FAULT_TRACE_OUT="$RUNNER_TEMP/journal-metadata-failure.json" go test -p=1 -race -json ./sim ./integration -run '^(TestSeededInitialJournalMetadataReplay|TestInitialJournalLookupRecoversHeldNetworkResponse|TestSerialJournalReadRecoversHeldNetworkResponse|TestManifestReadRecoversHeldNetworkResponse|TestJournalConsumerCreationRecoversHeldNetworkResponse)$' -count=1 -timeout=3m > "$RUNNER_TEMP/journal-read-recovery.jsonl"
      - name: Require semantic failure when the initial metadata bound is removed
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          baseline = [json.loads(line) for line in (root / 'journal-read-recovery.jsonl').read_text().splitlines()]
          names = ['TestSeededInitialJournalMetadataReplay', 'TestInitialJournalLookupRecoversHeldNetworkResponse', 'TestSerialJournalReadRecoversHeldNetworkResponse', 'TestManifestReadRecoversHeldNetworkResponse', 'TestJournalConsumerCreationRecoversHeldNetworkResponse']
          for name in names:
              assert [e['Action'] for e in baseline if e.get('Test') == name and e['Action'] in ('pass','fail','skip')] == ['pass']
          baseline_output = ''.join(e.get('Output','') for e in baseline)
          assert 'TIER1_SEEDS test=TestSeededInitialJournalMetadataReplay first=1 last=1000 completed=1000 requested=1000' in baseline_output
          hashes = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in ['journal/journal.go', 'integration/journal_serial_response_test.go', 'internal/handlecache/cache.go', 'sim/journal_lookup_replay_test.go', 'sim/testdata/regressions/journal-initial-metadata-recovery.json']}
          (root / 'journal-read-recovery-source-sha256.json').write_text(json.dumps(hashes, indent=2)+'\n')
          source = pathlib.Path('journal/journal.go').resolve()
          original = source.read_text()
          anchor = 'stream, err = boundedReadRequest(ctx, wait, "journal stream lookup", lookup)'
          assert original.count(anchor) == 1
          changed = root / 'unbounded-journal-lookup.go'
          changed.write_text(original.replace(anchor, 'stream, err = lookup(ctx)\n\t\t_ = wait'))
          overlay = root / 'unbounded-journal-lookup-overlay.json'
          overlay.write_text(json.dumps({'Replace': {str(source): str(changed)}}))
          test = 'TestInitialJournalLookupRecoversHeldNetworkResponse'
          tests = ['TestSeededInitialJournalMetadataReplay', 'TestInitialJournalLookupRecoversHeldNetworkResponse']
          result = subprocess.run(['go', 'test', '-p=1', '-overlay='+str(overlay), '-json', './sim', './integration', '-run', '^('+'|'.join(tests)+')$', '-count=1', '-timeout=1m'], env=dict(os.environ, FAULT_TRACE_OUT=str(root / 'unbounded-metadata-failure.json')), text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=90)
          (root / 'unbounded-journal-lookup.jsonl').write_text(result.stdout)
          events = [json.loads(line) for line in result.stdout.splitlines() if not line.startswith('go: downloading ')]
          for name in tests:
              assert [e['Action'] for e in events if e.get('Test') == name and e['Action'] in ('pass','fail','skip')] == ['fail']
          output = ''.join(e.get('Output','') for e in events if e.get('Test') == test)
          assert result.returncode != 0
          assert 'metadata request is unbounded' in result.stdout
          assert 'lost initial journal metadata response occupied the read deadline without a retry' in output
          assert 'panic: test timed out' not in result.stdout
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journal-read-recovery
          path: |
            ${{ runner.temp }}/journal-read-recovery.jsonl
            ${{ runner.temp }}/unbounded-journal-lookup.jsonl
            ${{ runner.temp }}/unbounded-journal-lookup-overlay.json
            ${{ runner.temp }}/unbounded-journal-lookup.go
            ${{ runner.temp }}/journal-read-recovery-source-sha256.json
            ${{ runner.temp }}/journal-metadata-failure.json
            ${{ runner.temp }}/unbounded-metadata-failure.json
          if-no-files-found: warn
