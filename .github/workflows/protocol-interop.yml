name: journal-protocol-interop
on:
  workflow_dispatch:
  push:
    paths: ['protocol/**', 'journal/**', 'worker/**', 'client/**', 'integrity/**', 'retention/**', 'cmd/wf-worker/**', 'integration/journal_encoding_test.go', 'integration/visibility_test.go', 'integration/confirmed_ack_contract_test.go', 'scripts/check-protocol-interop.py', 'scripts/protocol-vectors/**', 'wf/**', 'go.mod', 'go.sum', '.github/workflows/protocol-interop.yml']
  pull_request:
    paths: ['protocol/**', 'journal/**', 'worker/**', 'client/**', 'integrity/**', 'retention/**', 'cmd/wf-worker/**', 'integration/journal_encoding_test.go', 'integration/visibility_test.go', 'integration/confirmed_ack_contract_test.go', 'scripts/check-protocol-interop.py', 'scripts/protocol-vectors/**', 'wf/**', 'go.mod', 'go.sum', '.github/workflows/protocol-interop.yml']
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install independent protobuf compiler and Python runtime
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler python3-protobuf
      - name: Check Go envelope and SDK recovery decisions
        run: |
          go run -p=1 ./scripts/protocol-vectors > "$RUNNER_TEMP/protocol-vectors.json"
          cmp protocol/testdata/vectors.json "$RUNNER_TEMP/protocol-vectors.json"
          go test -p=1 -race ./journal ./protocol/...
      - name: Verify real protobuf worker, mixed-format compaction and CLI
        run: |
          set -euo pipefail
          go test -p=1 ./integration -list '^TestProtobufWorkerResumesJSONPrefixAndCompacts$' | grep -Fx 'TestProtobufWorkerResumesJSONPrefixAndCompacts'
          go test -p=1 ./integration -list '^TestJSONWorkerResumesProtobufStep$' | grep -Fx 'TestJSONWorkerResumesProtobufStep'
          go test -p=1 ./integration -list '^TestProjectionRebuildLagAndPurge$' | grep -Fx 'TestProjectionRebuildLagAndPurge'
          go test -p=1 ./integration -list '^TestReplicatedConfirmedAckWithHeldReply$' | grep -Fx 'TestReplicatedConfirmedAckWithHeldReply'
          go test -p=1 ./worker -list '^TestConfirmedDispatchAcknowledgementRespectsDeadline$' | grep -Fx 'TestConfirmedDispatchAcknowledgementRespectsDeadline'
          go test -p=1 ./cmd/wf-worker -list '^TestWorkerRunnerProtobufJournal$' | grep -Fx 'TestWorkerRunnerProtobufJournal'
          go test -p=1 -race ./integration -run '^(TestProtobufWorkerResumesJSONPrefixAndCompacts|TestJSONWorkerResumesProtobufStep|TestProjectionRebuildLagAndPurge|TestReplicatedConfirmedAckWithHeldReply)$' -count=1 -v
          go test -p=1 -race ./worker -run '^TestConfirmedDispatchAcknowledgementRespectsDeadline$' -count=1 -v
          go test -p=1 -race ./cmd/wf-worker -run '^TestWorkerRunnerProtobufJournal$' -count=1 -v
      - name: Exchange exact uint64 and JSON payload bytes with Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-evidence/generated
          protoc --version | tee protocol-evidence/versions.log
          /usr/bin/python3 -c 'import google.protobuf; print(google.protobuf.__version__)' | tee -a protocol-evidence/versions.log
          protoc --python_out=protocol-evidence/generated protocol/v1/journal.proto
          /usr/bin/python3 scripts/check-protocol-interop.py protocol-evidence/generated protocol-evidence/python | tee protocol-evidence/interop.log
          PROTOCOL_INTEROP_DIR="$GITHUB_WORKSPACE/protocol-evidence/python" go test -p=1 -race ./protocol -run '^TestPortableVectors$' -v | tee protocol-evidence/reverse.log
          sha256sum protocol/v1/journal.proto protocol/testdata/vectors.json protocol-evidence/python/vectors.json > protocol-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-protocol-interop
          path: protocol-evidence/
