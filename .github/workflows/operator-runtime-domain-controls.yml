name: operator-runtime-domain-controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/operator-runtime-domain-controls.yml'
      - 'cmd/wf/**'
      - 'cmd/wf-worker/**'
      - 'scripts/run-operator-domain-controls.py'
      - 'scripts/run-worker-domain-controls.py'
      - 'scripts/worker_leaf_wire.py'
      - 'scripts/test_worker_leaf_wire.py'
      - 'scripts/operator_leaf_wire.py'
      - 'scripts/test_operator_leaf_wire.py'
      - 'scripts/operator_daemon_leaf_wire.py'
      - 'scripts/test_operator_daemon_leaf_wire.py'
      - 'scripts/run-domain-runtime-controls.py'
      - 'scripts/fixture_archive.py'
      - 'scripts/verify-tier2-closed-originals.py'
      - 'assignment/**'
      - 'client/**'
      - 'worker/**'
      - 'wf/**'
      - 'visibility/**'
      - 'reconcile/**'
      - 'retention/**'
      - 'runtimeclock/**'
      - 'provision/**'
      - 'identity/**'
      - 'journal/**'
      - 'lease/**'
      - 'internal/**'
      - 'testcluster/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/operator-runtime-domain-controls.yml'
      - 'cmd/**'
      - 'scripts/**'
      - 'assignment/**'
      - 'client/**'
      - 'worker/**'
      - 'wf/**'
      - 'visibility/**'
      - 'reconcile/**'
      - 'retention/**'
      - 'runtimeclock/**'
      - 'provision/**'
      - 'identity/**'
      - 'journal/**'
      - 'lease/**'
      - 'internal/**'
      - 'testcluster/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  canonical-postgres-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wf_canonical_cli
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wf_canonical_cli"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WF_OPERATOR_STANDALONE: '1'
      WF_TEST_POSTGRES_DSN: postgres://postgres:fixture@127.0.0.1:5432/wf_canonical_cli?sslmode=disable
      WF_OPERATOR_TEST_ROOT: ${{ runner.temp }}/canonical-postgres-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run compiled canonical PostgreSQL commands and visibility controls
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$WF_OPERATOR_TEST_ROOT"
          go test -race -p=1 ./cmd/wf ./visibility -run '^(TestOperatorStandaloneCanonicalGraphPostgresCommands|TestGraphPostgresVisibilityCanonicalRowsAndUncertainty|TestPostgresNamespaceIsolation)$' -count=1 -v -timeout=20m 2>&1 | tee canonical-postgres-race.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('canonical-postgres-race.log').read_text()
          assert not re.search(r'^--- SKIP:', log, re.M)
          for name in ('TestOperatorStandaloneCanonicalGraphPostgresCommands', 'TestGraphPostgresVisibilityCanonicalRowsAndUncertainty', 'TestPostgresNamespaceIsolation'):
              assert re.search(r'^--- PASS: ' + name + r' ', log, re.M), name
          for case in ('R1', 'R3Domain'):
              assert re.search(r'--- PASS: TestOperatorStandaloneCanonicalGraphPostgresCommands/' + case + r' ', log), case
          PY
      - name: Preserve complete command and projector captures
        if: always()
        shell: bash
        run: |
          if [ -d "$WF_OPERATOR_TEST_ROOT" ]; then
            tar -C "$WF_OPERATOR_TEST_ROOT" -czf canonical-postgres-cli.tar.gz .
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-postgres-cli
          path: |
            canonical-postgres-race.log
            canonical-postgres-cli.tar.gz
          if-no-files-found: error
  graph-cursor-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: client
            tests: 'TestGraphAwaitContentionFreshReadAndGenerationFence|TestGraphAwaitOwnReadDeadline'
          - package: cmd/wf
            tests: 'TestNativeGraphCursorOperatorHistory|TestGraphOperatorCursorRejectsUnknownVersion|TestGraphOperatorRejectsPartialOrLegacyOnlySelection'
          - package: cmd/wf-worker
            tests: 'TestWorkerRunnerCanonicalCheckpointGraphRepair|TestWorkerRunnerCanonicalGraphRepair|TestWorkerGraphAdmissionRejectsIncompatibleCLI'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require explicit cursor selection and owned result controls under race
        shell: bash
        run: |
          set -o pipefail
          go test -race './${{ matrix.package }}' -run '^(${{ matrix.tests }})$' -count=1 -timeout=10m -v 2>&1 | tee graph-cursor-race.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-cursor-${{ strategy.job-index }}
          path: graph-cursor-race.log
          if-no-files-found: error
  command-domain-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {program: operator, case: commands, args: ""}
          - {program: operator, case: daemon-signals, args: "--case daemon-signals"}
          - {program: operator, case: standalone-commands, args: "--case standalone-commands"}
          - {program: operator, case: standalone-leaf, args: "--case standalone-leaf"}
          - {program: operator, case: standalone-daemon-leaf, args: "--case standalone-daemon-leaf"}
          - {program: operator, case: standalone-connection, args: "--case standalone-connection"}
          - {program: worker, case: commands, args: ""}
          - {program: worker, case: standalone-commands, args: "--case standalone-commands"}
          - {program: worker, case: standalone-leaf, args: "--case standalone-leaf"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check complete child wire framing and captured-proof controls
        if: matrix.case == 'standalone-leaf' && matrix.program == 'worker'
        run: python3 -m unittest discover -s scripts -p test_worker_leaf_wire.py
      - name: Check complete operator child wire and accepted-connection controls
        if: matrix.case == 'standalone-leaf' && matrix.program == 'operator'
        run: |
          go test -race ./testcluster -run '^Test(ClientProxyCountsFailedUpstreamDials|ClientProxyFirstAPIBarrier|ReadClientPacketRejectsMalformedPublications)$' -count=1
          python3 -m unittest discover -s scripts -p test_operator_leaf_wire.py
      - name: Check packaged daemon held publications and complete leaf captures
        if: matrix.case == 'standalone-daemon-leaf'
        run: |
          go test -race ./testcluster -run '^Test(ClientProxyFirstAPIBarrier|ReadClientPacketRejectsMalformedPublications)$' -count=1
          python3 -m unittest discover -s scripts -p test_operator_daemon_leaf_wire.py
      - name: Require actual default and domain race controls
        run: python3 scripts/run-${{ matrix.program }}-domain-controls.py ${{ matrix.args }} --root '${{ runner.temp }}/command-domain-${{ matrix.program }}-${{ matrix.case }}'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: command-domain-${{ matrix.program }}-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/command-domain-${{ matrix.program }}-${{ matrix.case }}.tar.gz
            ${{ runner.temp }}/command-domain-${{ matrix.program }}-${{ matrix.case }}-proof/
            ${{ runner.temp }}/command-domain-${{ matrix.program }}-${{ matrix.case }}/*.json
            ${{ runner.temp }}/command-domain-${{ matrix.program }}-${{ matrix.case }}/*.log
          if-no-files-found: error
