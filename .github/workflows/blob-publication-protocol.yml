name: blob-publication-protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/blobpublication/**'
      - 'testcluster/client_proxy*'
      - 'sim/blob_publication*'
      - 'sim/authority_witness*'
      - 'sim/journal_transport_test.go'
      - 'sim/testdata/regressions/blob-publication-*'
      - 'sim/testdata/regressions/authority-witness-*'
      - '.github/workflows/blob-publication-protocol.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/blobpublication/**'
      - 'testcluster/client_proxy*'
      - 'sim/blob_publication*'
      - 'sim/authority_witness*'
      - 'sim/journal_transport_test.go'
      - 'sim/testdata/regressions/blob-publication-*'
      - 'sim/testdata/regressions/authority-witness-*'
      - '.github/workflows/blob-publication-protocol.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  experimental-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seeded replay, native authority, object and process kill controls
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
        run: |
          mkdir -p "$RUNNER_TEMP/blob-native-authority"
          WF_BLOB_AUTHORITY_ROOT="$RUNNER_TEMP/blob-native-authority" go test -race ./internal/blobpublication -count=1 -timeout=3m -json > blob-publication-events.jsonl
      - name: Exact publication and existing API selector controls
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
        run: go test -race ./testcluster -run '^(TestClientProxy(ExactPublicationSelector|FirstAPIBarrier|ConsumerCreationSelector)|TestPublicationExemptionOnlyExaminesHeaders)$' -count=1 -timeout=2m
      - name: Common Tier 1 workload and pinned trace dispatch
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 512MiB
          SIM_COVERAGE_SUMMARY: '1'
        run: go test -race ./sim -run '^(TestSeededBlobPublicationReplay|TestSeededAuthorityReadWitnessReplay|TestPinnedRegressionCorpus)$/^(blob-publication-|authority-witness-)' -count=1 -timeout=3m -json > blob-publication-tier1-events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-blob-publication-events
          path: |
            blob-publication-events.jsonl
            blob-publication-tier1-events.jsonl
            ${{ runner.temp }}/blob-native-authority
