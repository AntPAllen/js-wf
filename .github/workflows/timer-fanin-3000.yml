name: timer-fanin-3000
on: workflow_dispatch
jobs:
  fanin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestThreeThousandTimersDueInOneSecond$' -count=1 -timeout=7m -v
        env:
          WF_TIMER_FANIN_SCALE: '1'
