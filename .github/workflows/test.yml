name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./wf ./workflowlint ./identity ./journal ./lease ./provision ./reconcile ./client ./history ./worker ./integrity ./testcluster ./sim ./cmd/wf ./cmd/wf-lint ./cmd/wf-cas-bench ./cmd/wf-scale
        env:
          # Go runs sim tests from sim/, matching the artifact glob below.
          FAULT_TRACE_OUT: sim-failure.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tier1-failure-trace
          path: sim/sim-failure*.json
          if-no-files-found: ignore
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -count=1 -timeout=20m
  long-journal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^(TestFiveThousandEntriesWithRepeatedSnapshots|TestJournalMaxEntriesBoundary)$' -count=1 -timeout=25m
        env:
          WF_LONG_TEST: '1'
          WF_JOURNAL_BOUNDARY: '1'
  dispatch-scale:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestTenThousandShortInvocationsAcrossAllPartitions$' -count=1 -timeout=15m -v
        env:
          WF_DISPATCH_SCALE: '1'
