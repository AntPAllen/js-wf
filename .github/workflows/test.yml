name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./wf ./workflowlint ./identity ./journal ./lease ./provision ./reconcile ./client ./history ./worker ./integrity ./testcluster ./sim ./cmd/wf ./cmd/wf-worker ./cmd/wf-lint ./cmd/wf-cas-bench ./cmd/wf-scale
        env:
          # Go runs sim tests from sim/, matching the artifact glob below.
          FAULT_TRACE_OUT: sim-failure.json
      - if: failure()
        timeout-minutes: 4
        run: |
          if test -f sim/sim-failure.json; then
            cd sim
            FAULT_TRACE=sim-failure.json FAULT_TRACE_MIN_OUT=sim-failure-minimized.json go test -run '^TestMinimizeFaultTrace$' -count=1 -timeout=3m
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tier1-failure-trace
          path: sim/sim-failure*.json
          if-no-files-found: ignore
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -count=1 -timeout=20m -skip '^(TestFiveHundredChildFanout|TestJournalCASTenThousandRacesWithLeaderRestarts)'
  cluster-scale-fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestFiveHundredChildFanout($|AcrossJournalLeaderRestart$|AfterParentSIGKILL$)' -count=1 -timeout=20m -v
  cluster-scale-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestJournalCASTenThousandRacesWithLeaderRestarts$' -count=1 -timeout=16m -v
  cluster-rebalance-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Rebalance 200 workflows across four combined faults
        run: WF_REBALANCE_COMBINED_CHAOS=1 go test ./integration -run '^TestTwoHundredWorkflowsRebalanceDuringCombinedFaults$' -count=1 -timeout=7m -v
  chaos-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure disk syscall tracer
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          if test -f /proc/sys/kernel/yama/ptrace_scope; then
            sudo sysctl -w kernel.yama.ptrace_scope=0
          fi
      - name: Replay 20 recorded four-fault seeds
        run: |
          for seed in $(seq 1 20); do
            WF_DISK_FAULT=1 FAULT_SEED="$seed" FAULT_SCHEDULE_OUT="fault-schedule-${seed}.json" go test ./testcluster -run '^TestProcessClusterCombinedFourFaultsRecover$' -count=1 -timeout=90s -v
          done
      - name: Complete a journaled workflow after four server faults
        run: WF_PROCESS_WORKFLOW=1 FAULT_SEED=42 FAULT_SCHEDULE_OUT=workflow-four-faults.json go test ./integration -run '^TestWorkflowRecoversFromFourServerFaults$' -count=1 -timeout=3m -v
      - name: Recover a due timer after four server faults
        run: WF_PROCESS_WORKFLOW=1 FAULT_SEED=42 FAULT_SCHEDULE_OUT=timer-four-faults.json go test ./integration -run '^TestTimerWorkflowRecoversFromFourServerFaults$' -count=1 -timeout=3m -v
      - name: Resume a signal wait after four server faults
        run: WF_PROCESS_WORKFLOW=1 FAULT_SEED=42 FAULT_SCHEDULE_OUT=signal-four-faults.json go test ./integration -run '^TestSignalWorkflowRecoversFromFourServerFaults$' -count=1 -timeout=4m -v
      - name: Recover a six-child fan-out after four server faults
        run: WF_PROCESS_WORKFLOW=1 FAULT_SEED=42 FAULT_SCHEDULE_OUT=fanout-four-faults.json go test ./integration -run '^TestFanoutWorkflowRecoversFromFourServerFaults$' -count=1 -timeout=4m -v
      - name: Recover a mixed workflow batch after four server faults
        run: WF_MIXED_CHAOS=1 FAULT_SEED=42 FAULT_SCHEDULE_OUT=mixed-four-faults.json go test ./integration -run '^TestMixedWorkflowsRecoverFromFourServerFaults$' -count=1 -timeout=5m -v
      - name: Recover six pending children after a full server restart
        run: WF_FULL_RESTART_FANOUT=1 go test ./integration -run '^TestFanoutSurvivesFullServerRestart$' -count=1 -timeout=4m -v
      - name: Consume one hundred ordered signals after a full server restart
        run: WF_FULL_RESTART_SIGNAL=1 go test ./integration -run '^TestOrderedSignalsSurviveFullServerRestart$' -count=1 -timeout=4m -v
      - name: Recover one thousand short workflows after a full server restart
        run: WF_FULL_RESTART_SHORT=1 go test ./integration -run '^TestThousandShortWorkflowsSurviveFullServerRestart$' -count=1 -timeout=5m -v
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: process-chaos-fault-schedules
          path: |
            testcluster/fault-schedule-*.json
            integration/workflow-four-faults.json
            integration/timer-four-faults.json
            integration/signal-four-faults.json
            integration/fanout-four-faults.json
            integration/mixed-four-faults.json
            integration/mixed-four-faults-server-*.log
          if-no-files-found: ignore
  long-journal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^(TestFiveThousandEntriesWithRepeatedSnapshots|TestJournalMaxEntriesBoundary)$' -count=1 -timeout=25m
        env:
          WF_LONG_TEST: '1'
          WF_JOURNAL_BOUNDARY: '1'
  dispatch-scale:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestTenThousandShortInvocationsAcrossAllPartitions$' -count=1 -timeout=15m -v
        env:
          WF_DISPATCH_SCALE: '1'
