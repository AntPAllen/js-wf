name: timer-1000-restart
on: workflow_dispatch
jobs:
  full-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./integration -run '^TestThousandTimersSurviveFullServerRestart$' -count=1 -timeout=5m -v
        env:
          WF_FULL_RESTART_TIMERS: '1'
