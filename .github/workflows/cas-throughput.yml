name: cas-throughput
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cas-throughput.yml'
      - 'scripts/check-cas-throughput.py'
      - 'scripts/test_cas_throughput.py'
      - 'cmd/wf-cas-bench/**'
      - 'journal/**'
      - 'provision/**'
      - 'testcluster/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/cas-throughput.yml'
      - 'scripts/check-cas-throughput.py'
      - 'scripts/test_cas_throughput.py'
      - 'cmd/wf-cas-bench/**'
      - 'journal/**'
      - 'provision/**'
      - 'testcluster/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  paired-throughput:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Fixed reference; changes are explicit source edits, never automatic refresh.
      BASELINE_REVISION: 4fa311954f42d1325a46dad12bb5d128dad2b747
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify comparison controls
        run: python3 -m unittest discover -s scripts -p 'test_cas_throughput.py' -v
      - name: Build both revisions before measurement
        run: |
          mkdir -p "$RUNNER_TEMP/cas-throughput"
          git worktree add --detach "$RUNNER_TEMP/cas-baseline" "$BASELINE_REVISION"
          go build -o "$RUNNER_TEMP/cas-throughput/candidate" ./cmd/wf-cas-bench
          cd "$RUNNER_TEMP/cas-baseline"
          go build -o "$RUNNER_TEMP/cas-throughput/baseline" ./cmd/wf-cas-bench
      - name: Require both median rates within twenty percent of baseline
        run: |
          python3 scripts/check-cas-throughput.py \
            --baseline-binary "$RUNNER_TEMP/cas-throughput/baseline" \
            --candidate-binary "$RUNNER_TEMP/cas-throughput/candidate" \
            --baseline-revision "$BASELINE_REVISION" \
            --candidate-revision "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/cas-throughput/reports"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-cas-throughput
          path: ${{ runner.temp }}/cas-throughput/reports
          if-no-files-found: warn
