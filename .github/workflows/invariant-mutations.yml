name: invariant-mutations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/invariant-mutations.yml'
      - 'scripts/check-invariant-mutations.py'
      - 'integration/mixed_determinism_mutation_test.go'
      - 'integration/mixed_cas_mutation_test.go'
      - 'integration/mixed_enqueue_mutation_test.go'
      - 'worker/*.go'
      - 'testcluster/*.go'
      - 'journal/journal.go'
      - 'lease/lease.go'
      - 'retention/purge.go'
      - 'wf/context.go'
      - 'client/client.go'
      - 'reconcile/starts.go'
      - 'integration/journal_cas_race_scale_test.go'
      - 'integration/journal_cas_audit_test.go'
      - 'integration/core_test.go'
      - 'integration/ack_loss_test.go'
      - 'retention/purge_test.go'
      - 'sim/workflow_replay_test.go'
      - 'sim/start_transport_test.go'
      - 'go.mod'
      - 'go.sum'
jobs:
  semantic-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require six semantic production mutation detections
        run: python3 scripts/check-invariant-mutations.py --output "$RUNNER_TEMP/invariant-mutations"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-production-mutations
          path: ${{ runner.temp }}/invariant-mutations
          if-no-files-found: warn

  mixed-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Detect a removed guard through the mixed worker and real leader kill
        run: python3 scripts/check-invariant-mutations.py --mixed-determinism --output "$RUNNER_TEMP/mixed-determinism"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixed-production-determinism
          path: ${{ runner.temp }}/mixed-determinism
          if-no-files-found: error

  mixed-leases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Detect independent lease keys with held replacement effects after leader kill
        run: python3 scripts/check-invariant-mutations.py --mixed-leases --output "$RUNNER_TEMP/mixed-leases"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixed-production-leases
          path: ${{ runner.temp }}/mixed-leases
          if-no-files-found: error

  mixed-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Detect missing CAS using retained duplicate indexes after leader kill
        run: python3 scripts/check-invariant-mutations.py --mixed-cas --output "$RUNNER_TEMP/mixed-cas"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixed-production-cas
          path: ${{ runner.temp }}/mixed-cas
          if-no-files-found: error

  mixed-enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Detect missing message IDs using retained dispatch duplicates after leader kill
        run: python3 scripts/check-invariant-mutations.py --mixed-enqueue --output "$RUNNER_TEMP/mixed-enqueue"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixed-production-enqueue
          path: ${{ runner.temp }}/mixed-enqueue
          if-no-files-found: error
