name: tier3-mixed-leaders
on:
  workflow_dispatch:
    inputs:
      row:
        description: R5 leader fault row
        type: choice
        required: true
        default: journal
        options: [journal, consumer, restart]
      duration:
        description: Ten minutes is sustained; 35 seconds is fixture smoke only
        required: true
        type: choice
        default: '10m'
        options: ['35s', '10m']
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WF_TIER3_MATRIX: '1'
      TIER3_MATRIX_ROW: ${{ inputs.row }}
      WF_TIER3_MATRIX_DURATION: ${{ inputs.duration }}
      WF_TIER3_SYNC_INTERVAL: '2m'
      TIER3_MATRIX_ARTIFACT_ROOT: /tmp/tier3-mixed-journal
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify row-result guard
        run: python3 -m unittest discover -s scripts -p 'test_tier3*.py'
      - name: Sustain the selected five-container mixed leader row
        run: |
          set -o pipefail
          case "$TIER3_MATRIX_ROW" in
            journal) row_test=TestFiveContainerMixedJournalLeaderEveryThirtySeconds ;;
            consumer) row_test=TestFiveContainerMixedConsumerLeaderEveryThirtySeconds ;;
            restart) row_test=TestFiveContainerMixedAllServersEveryThirtySeconds ;;
            *) exit 1 ;;
          esac
          go test -p=1 -race -json ./integration -run "^${row_test}$" -count=1 -timeout=20m | tee /tmp/tier3-mixed-journal-events.jsonl | python3 -u scripts/render-go-test.py
          python3 scripts/check-tier3-journal-row.py --root "$TIER3_MATRIX_ARTIFACT_ROOT" --row "$TIER3_MATRIX_ROW" --events /tmp/tier3-mixed-journal-events.jsonl --duration "$WF_TIER3_MATRIX_DURATION" --output /tmp/tier3-mixed-journal-result.json
          python3 scripts/explain-tier3-events.py --root "$TIER3_MATRIX_ARTIFACT_ROOT" --output "$TIER3_MATRIX_ARTIFACT_ROOT/event-explanations.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-mixed-journal
          path: |
            /tmp/tier3-mixed-journal/*.json
            /tmp/tier3-mixed-journal/*.jsonl
            /tmp/tier3-mixed-journal/*.log
            /tmp/tier3-mixed-journal/cluster/nats.conf
            /tmp/tier3-mixed-journal-events.jsonl
            /tmp/tier3-mixed-journal-result.json
          if-no-files-found: warn
