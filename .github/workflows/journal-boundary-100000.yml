name: journal-boundary-100000
on:
  workflow_dispatch:
jobs:
  journal-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WF_JOURNAL_BOUNDARY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify 100,000-entry journal boundary and full read
        run: go test ./integration -run '^TestJournalMaxEntriesBoundary$' -count=1 -timeout=25m -v
