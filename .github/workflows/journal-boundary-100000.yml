name: journal-boundary-100000
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Boundary tests to run
        type: choice
        default: all
        options: [all, journal, continuation, blob]
jobs:
  journal-boundary:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'journal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WF_JOURNAL_BOUNDARY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify 100,000-entry journal boundary and full read
        run: go test ./integration -run '^TestJournalMaxEntriesBoundary$' -count=1 -timeout=25m -v
  continuation-boundary:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'continuation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WF_CONTINUATION_BOUNDARY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify production continuation cap across checkpoints and replacement
        run: go test ./worker -run '^TestContinuationProductionJournalLimitBoundary$' -count=1 -timeout=25m -v
  blob-enumeration-boundary:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'blob' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WF_BLOB_ENUMERATION_SCALE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify real Object Store and KV enumeration beyond 100,000 subjects
        run: |
          set -o pipefail
          go test ./integration -run '^TestQuiescentBlobSweepPaginationBoundary$' -count=1 -timeout=25m -v | tee blob-enumeration.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-enumeration-boundary
          path: blob-enumeration.log
          if-no-files-found: error
