name: tier3-container-smoke
on: workflow_dispatch
jobs:
  five-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WF_TIER3_CONTAINER: '1'
      WF_TIER3_HISTORY_OUT: tier3-client-history.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify five isolated NATS containers
        run: go test ./integration -run '^TestFiveContainer(WorkflowSurvivesIsolationAndRestart|AckedPublishesSurviveLeaderKill)$' -count=1 -timeout=12m -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-client-history
          path: integration/tier3-client-history.jsonl
          if-no-files-found: ignore
