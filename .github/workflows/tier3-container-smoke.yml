name: tier3-container-smoke
on:
  workflow_dispatch:
    inputs:
      sync_interval:
        description: NATS file-store sync interval used in production
        required: true
        default: '2m'
        type: string
jobs:
  five-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WF_TIER3_CONTAINER: '1'
      WF_TIER3_HISTORY_OUT: tier3-client-history.jsonl
      WF_TIER3_QUORUM_HISTORY_OUT: tier3-quorum-history.jsonl
      WF_TIER3_WORKER_HISTORY_OUT: tier3-worker-kill-history.jsonl
      WF_TIER3_FANOUT_HISTORY_OUT: tier3-fanout-restart-history.jsonl
      WF_TIER3_TIMER_HISTORY_OUT: tier3-timer-restart-history.jsonl
      WF_TIER3_SIGNAL_HISTORY_OUT: tier3-signal-restart-history.jsonl
      WF_TIER3_CONSUMER_HISTORY_OUT: tier3-consumer-leader-history.jsonl
      WF_TIER3_PAUSE_HISTORY_OUT: tier3-worker-pause-history.jsonl
      WF_TIER3_SYNC_INTERVAL: ${{ inputs.sync_interval }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify five isolated NATS containers
        run: go test ./integration -run '^TestFiveContainer(WorkflowSurvivesIsolationAndRestart|AckedPublishesSurviveLeader(Kill|Pause)|PublishRequiresQuorum|WorkerSIGKILLRecovers|WorkerPausePastLease|FanoutSurvivesFullRestart|TimersSurviveFullRestart|SignalsSurviveFullRestart|ConsumerLeaderKillDuringEffect)$' -count=1 -timeout=12m -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-client-history
          path: |
            integration/tier3-client-history.jsonl
            integration/tier3-quorum-history.jsonl
            integration/tier3-worker-kill-history.jsonl
            integration/tier3-fanout-restart-history.jsonl
            integration/tier3-timer-restart-history.jsonl
            integration/tier3-signal-restart-history.jsonl
            integration/tier3-consumer-leader-history.jsonl
            integration/tier3-worker-pause-history.jsonl
          if-no-files-found: ignore
