name: tier2-matrix-leaders
on:
  workflow_dispatch:
    inputs:
      row:
        description: Sustained fault row
        required: true
        type: choice
        default: journal
        options: [journal, consumer, cluster, partition, worker, pause, isolation, workerclock, serverclockplus, serverclockminus, fanoutrestart, blockdisk, upgrade]
      seeds:
        description: Consecutive seeds for the selected sustained row
        required: true
        type: choice
        default: '1'
        options: ['1', '20', '200']
      duration:
        description: Ten minutes is the matrix duration; 35 seconds is smoke only
        required: true
        type: choice
        default: '10m'
        options: ['10m', '35s']
jobs:
  seeds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.seeds }}
    steps:
      - id: matrix
        env:
          SEED_COUNT: ${{ inputs.seeds }}
          MATRIX_ROW: ${{ inputs.row }}
          MATRIX_DURATION: ${{ inputs.duration }}
        run: |
          python3 - <<'PY'
          import json, os
          count = int(os.environ['SEED_COUNT'])
          assert count in (1, 20, 200)
          assert os.environ['MATRIX_ROW'] in ('journal', 'consumer', 'cluster', 'partition', 'worker', 'pause', 'isolation', 'workerclock', 'serverclockplus', 'serverclockminus', 'fanoutrestart', 'blockdisk', 'upgrade')
          assert os.environ['MATRIX_DURATION'] in ('10m', '35s')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('seeds=' + json.dumps(list(range(1, count + 1))) + '\n')
          PY
  leader:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.matrix) }}
    env:
      WF_NATS_SERVER_BIN: ${{ runner.temp }}/nats-old/nats-server
      WF_MATRIX_CHAOS: '1'
      WF_MATRIX_DURATION: ${{ inputs.duration }}
      FAULT_SEED: ${{ matrix.seed }}
      MATRIX_ARTIFACT_PREFIX: matrix-${{ inputs.row }}-${{ matrix.seed }}
      MATRIX_TIMEOUT: ${{ (inputs.row == 'workerclock' || inputs.row == 'serverclockplus' || inputs.row == 'serverclockminus') && '20m' || '18m' }}
      MATRIX_TEST: ${{ inputs.row == 'upgrade' && 'TestMixedMatrixRollingServerUpgrade' || inputs.row == 'blockdisk' && 'TestMixedMatrixBlockDiskStallEveryThirtySeconds' || inputs.row == 'fanoutrestart' && 'TestMixedMatrixFanoutRestartEveryThirtySeconds' || inputs.row == 'serverclockplus' && 'TestMixedMatrixServerClockSkewPositive' || inputs.row == 'serverclockminus' && 'TestMixedMatrixServerClockSkewNegative' || inputs.row == 'workerclock' && 'TestMixedMatrixWorkerClockSkew' || inputs.row == 'isolation' && 'TestMixedMatrixWorkerReplyIsolationFortyFiveSeconds' || inputs.row == 'pause' && 'TestMixedMatrixWorkerPausedFortyFiveSeconds' || inputs.row == 'worker' && 'TestMixedMatrixRandomWorkerKilledEveryFiveSeconds' || inputs.row == 'partition' && 'TestMixedMatrixServerPartitionEveryThirtySeconds' || inputs.row == 'cluster' && 'TestMixedMatrixAllServersKilledEveryThirtySeconds' || inputs.row == 'consumer' && 'TestMixedMatrixConsumerLeaderEveryThirtySeconds' || 'TestMixedMatrixJournalLeaderEveryThirtySeconds' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build initial NATS 2.11.17 servers
        if: inputs.row == 'upgrade'
        run: |
          mkdir -p "$RUNNER_TEMP/nats-old"
          GOBIN="$RUNNER_TEMP/nats-old" go install github.com/nats-io/nats-server/v2@v2.11.17
      - name: Verify block device fault prerequisites
        if: inputs.row == 'blockdisk'
        run: |
          sudo -n dmsetup version
          sudo -n losetup --find
          command -v mkfs.ext4
          WF_BLOCK_DISK=1 go test -race ./testcluster -run '^TestBlockDiskStallBlocksSyncAndCleansUp$' -count=1 -timeout=2m -v
      - name: Sustain mixed workloads under the selected fault schedule
        run: go test ./integration -run "^${MATRIX_TEST}$" -count=1 -timeout="${MATRIX_TIMEOUT}" -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ inputs.row }}-${{ matrix.seed }}-${{ inputs.duration }}
          path: integration/matrix-${{ inputs.row }}-${{ matrix.seed }}-*
          if-no-files-found: error
