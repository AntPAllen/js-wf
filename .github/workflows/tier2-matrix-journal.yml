name: tier2-matrix-leaders
on:
  workflow_dispatch:
    inputs:
      row:
        description: Sustained fault row
        required: true
        type: choice
        default: journal
        options: [all, journal, consumer, cluster, partition, worker, pause, isolation, workerclock, serverclockplus, serverclockminus, fanoutrestart, blockdisk, upgrade]
      seeds:
        description: Consecutive seeds per sustained row (all selects the whole matrix)
        required: true
        type: choice
        default: '1'
        options: ['1', '20', '200']
      start_seed:
        description: First seed (non-1 ranges are focused replay, not full-range acceptance)
        required: true
        type: number
        default: 1
      duration:
        description: Ten minutes is the matrix duration; 35 seconds is smoke only
        required: true
        type: choice
        default: '10m'
        options: ['10m', '35s']
jobs:
  seeds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
      - id: matrix
        env:
          SEED_COUNT: ${{ inputs.seeds }}
          MATRIX_ROW: ${{ inputs.row }}
          MATRIX_DURATION: ${{ inputs.duration }}
          START_SEED: ${{ inputs.start_seed }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_workload_source.py'
          python3 -m unittest discover -s scripts -p 'test_matrix_*.py'
          python3 scripts/matrix-campaign.py
  leader:
    name: ${{ inputs.row == 'all' && format('leader ({0}, {1})', matrix.row, matrix.artifact_seed) || format('leader ({0})', matrix.first) }}
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.row == 'all' && 300 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.seeds.outputs.matrix) }}
    env:
      WF_MATRIX_CHAOS: '1'
      WF_MATRIX_OPERATION_TIMINGS: '1'
      WF_MATRIX_DURATION: ${{ inputs.duration }}
      FIRST_SEED: ${{ matrix.first }}
      LAST_SEED: ${{ matrix.last }}
      MATRIX_ROW: ${{ matrix.row }}
      MATRIX_TIMEOUT: ${{ (matrix.row == 'workerclock' || matrix.row == 'serverclockplus' || matrix.row == 'serverclockminus') && '20m' || '18m' }}
      MATRIX_TEST: ${{ matrix.row == 'upgrade' && 'TestMixedMatrixRollingServerUpgrade' || matrix.row == 'blockdisk' && 'TestMixedMatrixBlockDiskStallEveryThirtySeconds' || matrix.row == 'fanoutrestart' && 'TestMixedMatrixFanoutRestartEveryThirtySeconds' || matrix.row == 'serverclockplus' && 'TestMixedMatrixServerClockSkewPositive' || matrix.row == 'serverclockminus' && 'TestMixedMatrixServerClockSkewNegative' || matrix.row == 'workerclock' && 'TestMixedMatrixWorkerClockSkew' || matrix.row == 'isolation' && 'TestMixedMatrixWorkerReplyIsolationFortyFiveSeconds' || matrix.row == 'pause' && 'TestMixedMatrixWorkerPausedFortyFiveSeconds' || matrix.row == 'worker' && 'TestMixedMatrixRandomWorkerKilledEveryFiveSeconds' || matrix.row == 'partition' && 'TestMixedMatrixServerPartitionEveryThirtySeconds' || matrix.row == 'cluster' && 'TestMixedMatrixAllServersKilledEveryThirtySeconds' || matrix.row == 'consumer' && 'TestMixedMatrixConsumerLeaderEveryThirtySeconds' || 'TestMixedMatrixJournalLeaderEveryThirtySeconds' }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
      - name: Materialize complete workload and verifier inputs
        run: python3 scripts/materialize-workload-source.py --report "$RUNNER_TEMP/workload-source.json"
      - name: Retain source selection evidence
        uses: actions/upload-artifact@v7
        with:
          name: workload-source-${{ matrix.row }}-${{ matrix.artifact_seed }}
          path: ${{ runner.temp }}/workload-source.json
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build initial NATS 2.11.17 servers
        if: matrix.row == 'upgrade'
        run: |
          mkdir -p "$RUNNER_TEMP/nats-old"
          GOBIN="$RUNNER_TEMP/nats-old" go install github.com/nats-io/nats-server/v2@v2.11.17
          printf 'WF_NATS_SERVER_BIN=%s/nats-old/nats-server\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify block device fault prerequisites
        if: matrix.row == 'blockdisk'
        run: |
          sudo -n dmsetup version
          sudo -n losetup --find
          command -v mkfs.ext4
          WF_BLOCK_DISK=1 go test -race ./testcluster -run '^TestBlockDiskStallBlocksSyncAndCleansUp$' -count=1 -timeout=2m -v
      - name: Sustain mixed workloads under the selected fault schedule
        run: |
          set -o pipefail
          for seed in $(seq "$FIRST_SEED" "$LAST_SEED"); do
            echo "Sustained matrix row=$MATRIX_ROW seed=$seed duration=$WF_MATRIX_DURATION"
            result_log="integration/matrix-${MATRIX_ROW}-${seed}-test.jsonl"
            FAULT_SEED="$seed" MATRIX_ARTIFACT_PREFIX="matrix-${MATRIX_ROW}-${seed}" go test -json ./integration -run "^${MATRIX_TEST}$" -count=1 -timeout="${MATRIX_TIMEOUT}" | tee "$result_log" | python3 -u scripts/render-go-test.py
            python3 scripts/check-matrix-result.py "$result_log" "$MATRIX_TEST" "$WF_MATRIX_DURATION"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ matrix.row }}-${{ matrix.artifact_seed }}-${{ inputs.duration }}
          path: integration/matrix-${{ matrix.row }}-*-*
          if-no-files-found: error
