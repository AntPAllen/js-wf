name: continuation-promise-restart
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wf/**'
      - 'worker/**'
      - 'journal/**'
      - 'retention/**'
      - 'client/**'
      - 'provision/**'
      - 'testcluster/**'
      - 'go.mod'
      - 'go.sum'
      - 'integration/continuation_promise*.go'
      - 'integration/continuation_kill_test.go'
      - '.github/workflows/continuation-promise-restart.yml'
jobs:
  combined-cuts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WF_PROMISE_FULL_RESTART: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race-check six worker publication cuts with full server restart
        run: go test -race ./integration -run '^TestContinuationPromiseSIGKILLAndFullServerRestart$' -count=1 -timeout=8m -v 2>&1 | tee continuation-promise-restart.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: continuation-promise-restart
          path: continuation-promise-restart.log
          if-no-files-found: error
