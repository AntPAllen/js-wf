name: tier2-mixed
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: Consecutive mixed workload seeds
        required: true
        type: choice
        default: '20'
        options:
          - '20'
          - '200'
      start_seed:
        description: First seed in the consecutive range (default 1 for the release gate)
        required: true
        type: number
        default: 1
jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WF_MIXED_CHAOS: '1'
      MIXED_SEEDS: ${{ inputs.seeds || (github.event_name == 'schedule' && '200') || '20' }}
      MIXED_START_SEED: ${{ inputs.start_seed || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure disk syscall tracer
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          if test -f /proc/sys/kernel/yama/ptrace_scope; then
            sudo sysctl -w kernel.yama.ptrace_scope=0
          fi
      - name: Replay consecutive mixed workflow seeds
        run: |
          if ! [[ "$MIXED_START_SEED" =~ ^[1-9][0-9]*$ ]]; then
            echo "start_seed must be a positive integer" >&2
            exit 1
          fi
          last_seed=$((MIXED_START_SEED + MIXED_SEEDS - 1))
          for seed in $(seq "$MIXED_START_SEED" "$last_seed"); do
            echo "Mixed workflow seed $seed ($MIXED_START_SEED..$last_seed)"
            FAULT_SEED="$seed" FAULT_SCHEDULE_OUT="mixed-four-faults-${seed}.json" go test ./integration -run '^TestMixedWorkflowsRecoverFromFourServerFaults$' -count=1 -timeout=5m -v
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier2-mixed-fault-schedules
          path: |
            integration/mixed-four-faults-*.json
            integration/mixed-four-faults-*-server-*.log
          if-no-files-found: ignore
  lease-disk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WF_LEASE_DISK_CONTRACT: '1'
      LEASE_DISK_REPORT: lease-disk-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure disk syscall tracer
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          if test -f /proc/sys/kernel/yama/ptrace_scope; then
            sudo sysctl -w kernel.yama.ptrace_scope=0
          fi
      - name: Compare held acquisition and renewal on one delayed R3 leader
        run: go test -race ./integration -run '^TestLeaseContentionDiskContract$' -count=1 -timeout=3m -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lease-disk-contract
          path: integration/lease-disk-contract*
          if-no-files-found: error
