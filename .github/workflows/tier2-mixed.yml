name: tier2-mixed
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Consecutive mixed workload seeds
        required: true
        type: choice
        default: '20'
        options:
          - '20'
          - '200'
jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WF_MIXED_CHAOS: '1'
      MIXED_SEEDS: ${{ inputs.seeds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure disk syscall tracer
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
          if test -f /proc/sys/kernel/yama/ptrace_scope; then
            sudo sysctl -w kernel.yama.ptrace_scope=0
          fi
      - name: Replay consecutive mixed workflow seeds
        run: |
          for seed in $(seq 1 "$MIXED_SEEDS"); do
            echo "Mixed workflow seed $seed/$MIXED_SEEDS"
            FAULT_SEED="$seed" FAULT_SCHEDULE_OUT="mixed-four-faults-${seed}.json" go test ./integration -run '^TestMixedWorkflowsRecoverFromFourServerFaults$' -count=1 -timeout=5m -v
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier2-mixed-fault-schedules
          path: |
            integration/mixed-four-faults-*.json
            integration/mixed-four-faults-*-server-*.log
          if-no-files-found: ignore
