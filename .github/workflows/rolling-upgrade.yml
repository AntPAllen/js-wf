name: rolling-upgrade
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  mixed-version-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build NATS 2.11.17
        run: |
          mkdir -p "$RUNNER_TEMP/nats-old"
          GOBIN="$RUNNER_TEMP/nats-old" go install github.com/nats-io/nats-server/v2@v2.11.17
      - name: Run old-server and mixed-version contracts
        env:
          WF_NATS_SERVER_BIN: ${{ runner.temp }}/nats-old/nats-server
        run: go test ./integration -run '^(TestFallbackWithPre212Server|TestMixedVersionRollingUpgradeFallback)$' -count=1 -timeout=3m -v
  five-container-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static NATS 2.11.17
        run: |
          mkdir -p "$RUNNER_TEMP/nats-old"
          CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/nats-old" go install github.com/nats-io/nats-server/v2@v2.11.17
      - name: Upgrade one of five isolated containers
        env:
          WF_TIER3_CONTAINER: '1'
          WF_NATS_SERVER_BIN: ${{ runner.temp }}/nats-old/nats-server
          WF_TIER3_UPGRADE_HISTORY_OUT: tier3-rolling-upgrade-history.jsonl
        run: go test ./integration -run '^TestFiveContainerRollingUpgradeFallback$' -count=1 -timeout=6m -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-rolling-upgrade-history
          path: integration/tier3-rolling-upgrade-history.jsonl
          if-no-files-found: ignore
