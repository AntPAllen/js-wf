syntax = "proto3";

package jetstream.workflow.v1;
option go_package = "js-wf/protocol/v1;protocolv1";

// Versioned interchange envelope. Protobuf WF_JRN storage requires the WFJ-NUL
// prefix and sequence=0, documented in docs/journal-protocol.md. Bare envelope
// bytes are not a WF_JRN storage publish. JSON remains the default writer.
message JournalRecord {
  uint32 version = 1; // Must be 1. Zero/unknown versions are rejected.
  uint64 sequence = 2; // Physical JetStream sequence; zero for an unbound entry.
  JournalEntry entry = 3;
}

message JournalEntry {
  uint64 epoch = 1;
  uint64 index = 2;
  EntryKind kind = 3;
  // Exact UTF-8 JSON bytes, not google.protobuf.Value or ProtoJSON. This keeps
  // integers, whitespace, null, object references and hash inputs intact.
  bytes payload_json = 4;
  string worker_id = 5;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_STARTED = 1;
  ENTRY_KIND_STEP_REQUESTED = 2;
  ENTRY_KIND_STEP_COMPLETED = 3;
  ENTRY_KIND_SUSPENDED = 4;
  ENTRY_KIND_SIGNAL_CONSUMED = 5;
  ENTRY_KIND_ATTEMPT = 6;
  ENTRY_KIND_COMPLETED = 7;
  ENTRY_KIND_FAILED = 8;
}
