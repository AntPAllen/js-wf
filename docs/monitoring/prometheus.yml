global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/prometheus-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: wf-worker
    static_configs:
      - targets: ['127.0.0.1:9091']
        labels:
          cluster: workflows
